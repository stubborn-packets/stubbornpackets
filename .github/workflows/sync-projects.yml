name: Sync Projects Metadata

on:
  schedule:
    # Run daily at 06:00 UTC so the homepage always shows fresh project data
    - cron: '0 6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sync-projects]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use a PAT (with contents:write) if branch protection blocks the default GITHUB_TOKEN.
          # Create one at https://github.com/settings/tokens (classic, repo scope) or fine-grained.
          # Store as repo secret named WORKFLOW_TOKEN (or similar) and it will be used preferentially.
          token: ${{ secrets.WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sync project metadata from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # =====================================================
          # List of technical project repositories to track.
          # Add new ones here as you create them (owner/repo format).
          # =====================================================
          PROJECTS=(
            "stubborn-packets/cisco-ise"
            "stubborn-packets/proxmox-terraform"
            # Add future projects below as you create them, e.g.
            # "stubborn-packets/network-ml-labs"
            # "stubborn-packets/ansible-networking"
          )

          {
            echo "# This file is automatically managed by .github/workflows/sync-projects.yml"
            echo "# Do not edit manually — changes will be overwritten on the next sync."
            echo ""
            echo "projects:"
          } > data/projects.yaml

          for repo in "${PROJECTS[@]}"; do
            echo "Fetching metadata for $repo..."

            # Fetch repo metadata (works even if the repo is brand new or empty)
            REPO_JSON=$(gh repo view "$repo" --json name,description,stargazerCount,pushedAt,primaryLanguage,repositoryTopics,url,createdAt 2>/dev/null || echo '{}')

            if [ "$REPO_JSON" = "{}" ]; then
              echo "  Warning: Could not fetch $repo (repo may not exist or not be public yet)"
              continue
            fi

            NAME=$(echo "$REPO_JSON" | jq -r '.name')
            DESC=$(echo "$REPO_JSON" | jq -r '(.description | select(. != "")) // "No description yet"')
            STARS=$(echo "$REPO_JSON" | jq -r '.stargazerCount')
            LANG=$(echo "$REPO_JSON" | jq -r '.primaryLanguage.name // "N/A"')
            TOPICS=$(echo "$REPO_JSON" | jq -r '.repositoryTopics // [] | join(", ")')
            URL=$(echo "$REPO_JSON" | jq -r '.url')

            # Prefer last push date, fall back to creation date (handles nulls from brand new repos)
            LAST_UPDATED=$(echo "$REPO_JSON" | jq -r '.pushedAt // .createdAt')

            # Safely append YAML item (double-quote strings to handle special chars like : or quotes in descriptions)
            {
              echo "  - name: \"$(printf %s "$NAME" | sed 's/"/\\"/g')\""
              echo "    repo: \"$repo\""
              echo "    description: \"$(printf %s "$DESC" | sed 's/"/\\"/g')\""
              echo "    url: \"$URL\""
              echo "    stars: $STARS"
              echo "    language: \"$(printf %s "$LANG" | sed 's/"/\\"/g')\""
              echo "    topics: \"$(printf %s "$TOPICS" | sed 's/"/\\"/g')\""
              echo "    last_updated: \"$LAST_UPDATED\""
            } >> data/projects.yaml
          done

          echo "Updated data/projects.yaml"

      - name: Commit and push if changed
        run: |
          if git diff --quiet data/projects.yaml; then
            echo "No changes to project metadata"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/projects.yaml
          cat > /tmp/commit-msg << 'EOF'
          chore: sync project metadata from technical repositories

          Auto-generated by sync-projects workflow.
          See .github/workflows/sync-projects.yml for the list of tracked repos.
          EOF
          # The heredoc content above is indented to stay inside the YAML 'run: |' block scalar.
          # Strip the leading whitespace so the commit message looks clean.
          sed -i 's/^          //' /tmp/commit-msg
          git commit -F /tmp/commit-msg
          git push
          echo "Committed and pushed updated projects data"
