name: Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Prevent concurrent deployments on the same ref
concurrency:
  group: "pages-deploy-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Hugo (Extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.0'
          extended: true

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: |
            resources
            .hugo_build.lock
          key: ${{ runner.os }}-hugo-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Build
        run: hugo --minify

      - name: Verify build output
        run: |
          if [ ! -f public/index.html ]; then
            echo "ERROR: public/index.html not found"
            exit 1
          fi
          if ! grep -q "stubbornpackets" public/index.html; then
            echo "WARNING: 'stubbornpackets' not found in index.html - custom layout may not have rendered"
          fi
          echo "Build verification passed. Site size:"
          du -sh public/

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
          retention-days: 1

  # Production deployment (only on main)
  deploy-production:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://stubbornpackets.com
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: public

      - name: Deploy to Cloudflare Pages (Production)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=stubbornpackets --branch=main

      - name: Output deployment details
        run: |
          echo "Production deployed to: ${{ steps.deploy.outputs.deployment-url }}"
          echo "Production alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"

  # Preview deployment for every PR
  deploy-preview:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: public

      - name: Deploy Preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=stubbornpackets --branch=pr-${{ github.event.pull_request.number }} --commit-dirty=true

      - name: Output preview URL
        run: |
          echo "Preview deployed to: ${{ steps.deploy.outputs.deployment-url }}"
          echo "Direct preview: https://pr-${{ github.event.pull_request.number }}.stubbornpackets.pages.dev"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            const direct = `https://pr-${{ github.event.pull_request.number }}.stubbornpackets.pages.dev`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployed successfully!**\n\n**Main preview:** ${url}\n**Direct alias:** ${direct}`
            });
