baseURL: 'https://stubbornpackets.com/'
languageCode: 'en-us'
title: stubbornpackets
theme: PaperMod

params:
  description: "Homelab documentation — Network Engineering • IaC • ML"
  author: Joshua Buck
  
  # Theme & Layout
  defaultTheme: dark
  contentWidth: "wide"           # Makes the site wider
  style:
    main: "normal"                # Larger text overall
  
  # Homepage (custom layouts/index.html + data-driven sections)
  mainSections: ["blog"]

  # Custom homepage strings
  home:
    tagline: "From the lab to the lake — documenting real homelab engineering"

  # Features
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowToc: true
  ShowBreadCrumbs: true
  ShowRecentPosts: false   # We handle recent/featured manually on the custom home
  
  # Social Icons (update URLs later)
  socialIcons:
    - name: github
      url: "https://github.com/stubbornpackets"
    - name: linkedin
      url: "https://linkedin.com/in/joshuabuck"

  # Labels (logo in top-left nav)
  # Using the site brand name directly for consistency and to avoid broken icon rendering.
  # (The previous "🔬" emoji was being treated as an <img src> by the theme, causing ? in Safari.)
  label:
    text: "stubbornpackets"
    # No icon for maximum reliability across browsers. 
    # A small custom SVG could be added later via iconSVG if desired.

markup:
  highlight:
    style: github-dark
    noClasses: false

menu:
  main:
    - name: Blog
      url: /blog/
      weight: 10
    - name: About
      url: /about/
      weight: 20