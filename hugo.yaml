baseURL: 'https://stubbornpackets.com/'
languageCode: 'en-us'
title: stubbornpackets
theme: PaperMod

params:
  description: "Homelab documentation — Network Engineering • IaC • ML"
  author: Joshua Buck
  
  # Theme & Layout
  defaultTheme: dark
  contentWidth: "wide"           # Makes the site wider
  style:
    main: "normal"                # Larger text overall
  
  # Homepage (custom layouts/index.html + data-driven sections)
  mainSections: ["blog"]

  # Custom homepage strings
  home:
    tagline: "From the lab to the lake — documenting real homelab engineering"

  # Features
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowToc: true
  ShowBreadCrumbs: true
  ShowRecentPosts: false   # We handle recent/featured manually on the custom home
  
  # Social Icons (update URLs later)
  socialIcons:
    - name: github
      url: "https://github.com/stubbornpackets"
    - name: linkedin
      url: "https://linkedin.com/in/joshuabuck"

  # Labels (logo in top-left nav)
  # Brand name + custom inline SVG for reliable cross-browser rendering.
  # Using iconSVG (not "icon") so the theme outputs raw SVG (no <img> tag).
  # SVG uses currentColor → automatically matches text color in light + dark mode.
  label:
    text: "stubbornpackets"
    # Design notes for the iconSVG below:
    # - Rounded rect + short lines = "packet" (network packets + IaC "code as config")
    # - Stylized wave below = "lab to the lake" branding + NC homelab personality
    # - Extremely simple geometry so it stays crisp and legible at the rendered size
    iconSVG: '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="9" height="7" rx="1.3"/><path d="M6 5.5h5M6 7h3.2"/><path d="M2.5 13.2c1.6-.85 3.2 .9 4.8 .05 1.6-.85 3.2 .9 4.8 .05 1.6-.85 3.2 .9 4.8 .05"/></svg>'

markup:
  highlight:
    style: github-dark
    noClasses: false

menu:
  main:
    - name: Blog
      url: /blog/
      weight: 10
    - name: About
      url: /about/
      weight: 20