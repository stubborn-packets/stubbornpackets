baseURL: 'https://stubbornpackets.com/'
languageCode: 'en-us'
title: stubbornpackets
theme: PaperMod

params:
  description: "Homelab documentation — Network Engineering • IaC • ML"
  author: Joshua Buck
  
  # Theme & Layout
  defaultTheme: dark
  contentWidth: "wide"           # Makes the site wider
  style:
    main: "normal"                # Larger text overall
  
  # Homepage
  homeInfoParams:
    Title: "stubbornpackets"
    Content: "From the lab to the lake — documenting real homelab engineering"

  # Features
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowToc: true
  ShowBreadCrumbs: true
  ShowRecentPosts: true
  
  # Social Icons (update URLs later)
  socialIcons:
    - name: github
      url: "https://github.com/stubbornpackets"
    - name: linkedin
      url: "https://linkedin.com/in/joshuabuck"

  # Labels
  label:
    text: "Homelab Lab Notebook"
    icon: "🔬"
    iconHeight: 28

markup:
  highlight:
    style: github-dark
    noClasses: false

menu:
  main:
    - name: Blog
      url: /blog/
      weight: 10
    - name: About
      url: /about/
      weight: 20